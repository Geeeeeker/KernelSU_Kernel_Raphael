name: Repack Kernel to Boot.img & Image.gz-dtb

on:
  workflow_dispatch:
    inputs:
      base_boot_url:
        description: '用作底包的 boot.img URL'
        required: true
        default: 'https://github.com/Geeeeeker/KernelSU_Kernel_Raphael/raw/refs/heads/raphael-bootx-14-HyperMiui-erofs/boot/boot-lineage-raphael.img'
      new_kernel_url:
        description: '需要替换的新内核 Image.gz URL'
        required: true
        default: 'https://github.com/Geeeeeker/KernelSU_Kernel_Raphael/releases/download/raphael-202610281854/Image.gz'
      device_name:
        description: '设备代号 (用于命名)'
        required: true
        default: 'raphael'
      publish_release:
        description: '是否发布为 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  repack:
    name: Repack Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 git curl zip unzip file device-tree-compiler

      - name: Download tools
        run: |
          set -e
          # 从 LineageOS 镜像获取 AOSP 官方的 unpack_bootimg.py 和 mkbootimg.py
          curl -fL -o unpack_bootimg.py "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/unpack_bootimg.py"
          curl -fL -o mkbootimg.py "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/mkbootimg.py"
          
          # 获取 extract-dtb.py (使用 ollieparanoid/extract-dtb 仓库的 raw 链接，已验证可用)
          curl -fL -o extract-dtb.py "https://raw.githubusercontent.com/ollieparanoid/extract-dtb/49da4393611ac5874743736f47bb1555f9004973/extract-dtb.py"
          
          chmod +x unpack_bootimg.py mkbootimg.py extract-dtb.py
          echo "Tools downloaded and made executable."

      - name: Download base boot.img and new Image.gz
        run: |
          set -e
          curl -fL -o boot-base.img "${{ inputs.base_boot_url }}"
          curl -fL -o Image.gz "${{ inputs.new_kernel_url }}"
          ls -lh boot-base.img Image.gz
          file boot-base.img Image.gz

      - name: Unpack base boot.img
        id: unpack
        run: |
          set -e
          python3 unpack_bootimg.py --boot_img boot-base.img --out unpacked
          echo "--- Unpacked files ---"
          ls -lh unpacked/
          
          CMDLINE=$(cat unpacked/boot.img-cmdline 2>/dev/null || cat unpacked/cmdline 2>/dev/null || true)
          if [ -n "$CMDLINE" ]; then
            echo "cmdline=$CMDLINE" >> "$GITHUB_OUTPUT"
          fi
          
          PAGESIZE=$(cat unpacked/boot.img-pagesize 2>/dev/null || echo "4096")
          echo "pagesize=$PAGESIZE" >> "$GITHUB_OUTPUT"

      - name: Extract DTB from base boot.img
        run: |
          set -e
          # extract-dtb.py 的输出会包含一个 00_kernel 文件（原始内核镜像）
          # 我们需要的是它后面分离出的 .dtb 文件
          python3 extract-dtb.py unpacked/boot.img-kernel -o extracted-dtbs || \
          python3 extract-dtb.py boot-base.img -o extracted-dtbs
          
          echo "--- Extracted DTBs ---"
          ls -lh extracted-dtbs/
          
          # 过滤掉可能的 00_kernel 文件，只保留 .dtb 文件
          find extracted-dtbs -name '*.dtb' -print0 | sort -z | xargs -0 cat > combined.dtb
          
          if [ ! -s combined.dtb ]; then
            echo "Error: No valid dtb extracted or combined.dtb is empty."
            exit 1
          fi
          echo "Combined dtb size: $(du -h combined.dtb | cut -f1)"

      - name: Create Image.gz-dtb
        run: |
          set -e
          # 这是高通平台的标准做法：将 Image.gz 和合并后的 dtb 直接拼接
          cat Image.gz combined.dtb > Image.gz-dtb
          echo "--- Created Image.gz-dtb ---"
          ls -lh Image.gz-dtb
          file Image.gz-dtb

      - name: Repack new boot.img
        run: |
          set -e
          MKBOOTIMG_ARGS=(
            --kernel Image.gz-dtb
            --ramdisk unpacked/boot.img-ramdisk
            --output boot-new.img
          )
          
          if [ -n "${{ steps.unpack.outputs.cmdline }}" ]; then
            MKBOOTIMG_ARGS+=(--cmdline "${{ steps.unpack.outputs.cmdline }}")
          fi
          
          if [ -f unpacked/boot.img-header_version ]; then
            MKBOOTIMG_ARGS+=(--header_version "$(cat unpacked/boot.img-header_version)")
          fi
          
          if [ -f unpacked/boot.img-pagesize ]; then
            MKBOOTIMG_ARGS+=(--pagesize "$(cat unpacked/boot.img-pagesize)")
          fi
          
          if [ -f unpacked/boot.img-base ]; then
            MKBOOTIMG_ARGS+=(--base "$(cat unpacked/boot.img-base)")
          fi
          
          if [ -f unpacked/boot.img-os_version ]; then
            MKBOOTIMG_ARGS+=(--os_version "$(cat unpacked/boot.img-os_version)")
          fi
          
          if [ -f unpacked/boot.img-board ]; then
            MKBOOTIMG_ARGS+=(--board "$(cat unpacked/boot.img-board)")
          fi
          
          echo "Running: python3 mkbootimg.py ${MKBOOTIMG_ARGS[*]}"
          python3 mkbootimg.py "${MKBOOTIMG_ARGS[@]}"
          
          echo "--- Repacked boot.img ---"
          ls -lh boot-new.img
          file boot-new.img

      - name: Verify outputs
        run: |
          set -e
          echo "=== 产物列表 ==="
          ls -lh boot-new.img Image.gz-dtb combined.dtb
          
          python3 - <<'PY'
          with open('boot-new.img','rb') as f:
              magic = f.read(8)
          print("boot magic:", magic)
          assert magic == b'ANDROID!', "Invalid boot image magic!"
          print("boot.img magic OK.")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repacked-${{ inputs.device_name }}
          path: |
            boot-new.img
            Image.gz-dtb
            combined.dtb
          if-no-files-found: error

  release:
    name: Publish release
    needs: repack
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect files
        run: |
          set -e
          mkdir -p release
          cp artifacts/repacked-${{ inputs.device_name }}/boot-new.img release/boot-${{ inputs.device_name }}.img
          cp artifacts/repacked-${{ inputs.device_name }}/Image.gz-dtb release/Image.gz-dtb-${{ inputs.device_name }}
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repack-${{ inputs.device_name }}-${{ github.run_number }}
          name: Repack Kernel for ${{ inputs.device_name }} (#${{ github.run_number }})
          body: |
            | | |
            |---|---|
            | Device | `${{ inputs.device_name }}` |
            | Base boot | `${{ inputs.base_boot_url }}` |
            | New Kernel | `${{ inputs.new_kernel_url }}` |

            **刷机方式**
            - `boot-${{ inputs.device_name }}.img`：Fastboot 刷入 `fastboot flash boot boot-${{ inputs.device_name }}.img`
            - `Image.gz-dtb-${{ inputs.device_name }}`：可自行放入 AnyKernel3 刷机包（AK3 原生支持此文件名）。
          files: release/*
